name: Fetch Nifty 100 OHLCV Data

on:
  schedule:
    # Runs Monday to Friday at 12:00 UTC (5:30 PM IST)
    - cron: "0 12 * * 1-5"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance pandas pyarrow

      - name: Run Nifty 100 OHLCV downloader
        run: python src/data_loader.py

      - name: Commit and push Parquet files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update Nifty 100 OHLCV parquet files [skip ci]"
            git push
          fi
